{% extends 'base.html' %}

{% block title %}Admin Login - Pack-N-Ship{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 transform transition-all hover:shadow-2xl duration-300">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black italic mb-2">
                <span class="text-gray-800">Pack-</span><span class="text-[#FF751F]">N</span><span class="text-gray-800">-Ship</span>
            </h1>
            <p class="text-gray-500 font-medium text-sm">Secure Admin Portal</p>
        </div>

        <form method="POST" action="" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#FF751F] focus:border-[#FF751F] outline-none transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#FF751F] focus:border-[#FF751F] outline-none transition-all">
            </div>

            {% if form.errors %}
                <p class="text-red-500 text-sm font-medium text-center bg-red-50 py-2 rounded">Invalid username or password.</p>
            {% endif %}

            <button type="submit" class="w-full bg-[#FF751F] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#e6691c] transition-colors shadow-md shadow-[#ff751f]/30">
                Sign In to Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
